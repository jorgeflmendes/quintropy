[project]
name = "quintropy"
version = "0.9.0"
description = "Reproducible Bayesian information-theoretic solver for five-letter word puzzles"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jorge Filipe" }]
keywords = ["wordle", "bayesian-inference", "information-theory", "reproducible-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "numba>=0.59",
  "scikit-learn>=1.4",
  "wordfreq==3.1.1",
  "cmudict==1.1.3",
]

[project.urls]
Homepage = "https://github.com/jorgeflmendes/quintropy"
Repository = "https://github.com/jorgeflmendes/quintropy.git"
Issues = "https://github.com/jorgeflmendes/quintropy/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[project.scripts]
quintropy = "quintropy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/quintropy/data/frequency" = ["data/frequency/frequency_list.txt"]
"share/quintropy/data/history" = [
  "data/history/played_5_2026-08-12.csv",
  "data/history/played_5_2026-08-13_2026-08-25.csv",
]
"share/quintropy/data/wordlists" = [
  "data/wordlists/nonsolutions_classic_10657.txt",
  "data/wordlists/solutions_classic_2315.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
