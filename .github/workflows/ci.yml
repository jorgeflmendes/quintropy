name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q src benchmarks tests
      - run: python -m ruff format --check src benchmarks tests
      - run: python -m ruff check src benchmarks tests
      - run: python benchmarks/verify_wordlists.py
      - run: python benchmarks/verify_checksums.py
      - run: python benchmarks/audit_experiment.py results/baselines/editorial_regime_linguistic_tail_2026-05-01_2026-08-12
      - run: python -m pytest
      - run: node --test tests/web/*.test.mjs
